limit_req_zone $binary_remote_addr zone=uploads:10m rate=30r/m;
map $uri $download_disposition {
    ~/$ "";
    ~*\.(pdf|txt|mp3|wav|ogg|oga|m4a|aac|flac|mp4|webm|ogv|m4v|mov|jpg|jpeg|png|gif|webp|avif|bmp|ico)$ "inline";
    default "attachment";
}
# Built-in PDF and media viewers need their own rendering and range requests.
# HTML/SVG and other active uploads remain downloads with the strict sandbox.
map $uri $file_csp {
    default "sandbox allow-downloads; default-src 'none'; style-src 'unsafe-inline'";
    ~*\.pdf$ "frame-ancestors 'self'";
    ~*\.(mp3|wav|ogg|oga|m4a|aac|flac|mp4|webm|ogv|m4v|mov)$ "default-src 'none'; media-src 'self' blob:; style-src 'unsafe-inline'; frame-ancestors 'self'";
    ~*\.(jpg|jpeg|png|gif|webp|avif|bmp|ico)$ "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; frame-ancestors 'self'";
}
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;
    server_tokens off;
    charset utf-8;
    root /home/www/web;
    index index.html;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { try_files $uri $uri/ /index.html; }
    location /upload/ {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        auth_basic "Upload";
        auth_basic_user_file /run/secrets/upload_htpasswd;
        try_files /index.html =404;
    }
    location /api/ {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        auth_basic "Upload";
        auth_basic_user_file /run/secrets/upload_htpasswd;
        limit_req zone=uploads burst=30 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend api_server:8080;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
    location = /code { return 308 /code/; }
    location /code/ {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $code_backend code-server:8080;
        rewrite ^/code/(.*)$ /$1 break;
        proxy_pass http://$code_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_flags ~ secure httponly samesite=strict;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
    location /files/ {
        root /home/www;
        default_type application/octet-stream;
        types {
            application/pdf pdf;
            text/plain txt;
            audio/mpeg mp3;
            audio/wav wav;
            audio/ogg ogg oga;
            audio/mp4 m4a;
            audio/aac aac;
            audio/flac flac;
            video/mp4 mp4 m4v;
            video/webm webm;
            video/ogg ogv;
            video/quicktime mov;
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/avif avif;
            image/bmp bmp;
            image/x-icon ico;
        }
        autoindex on;
        autoindex_exact_size off;
        disable_symlinks on;
        add_header Content-Disposition $download_disposition;
        add_header Content-Security-Policy $file_csp always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
}

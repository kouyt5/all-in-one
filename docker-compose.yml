name: all-in-one
services:
  nginx:
    build:
      context: ./nginx
      args:
        VITE_ENABLE_CODE_SERVER: ${CODE_SERVER_ENABLED:-false}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - uploads:/home/www/files:ro
    secrets:
      - upload_htpasswd
      - tls_cert
      - tls_key
    depends_on:
      api_server:
        condition: service_healthy
    mem_limit: 96m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  api_server:
    build: ./nginx/src/fuploads
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx192m -XX:MaxDirectMemorySize=32m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
      UPLOAD_ROOT: /data/uploads
    volumes:
      - uploads:/data/uploads
    mem_limit: 448m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/api/health]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    logging: *logging
  code-server:
    image: ghcr.io/coder/code-server:4.141.0@sha256:72ab24b5680ee597dd647b30d82625752f40109b5f61bef90ffbf1ea1f02dbb8
    profiles: [ide]
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8080/login]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    init: true
    restart: unless-stopped
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - code_home:/home/coder
    secrets: [code_password]
    entrypoint: [/bin/sh, -ec]
    command: ['mkdir -p /home/coder/project; export PASSWORD="$$(cat /run/secrets/code_password)"; exec /usr/bin/entrypoint.sh --bind-addr 0.0.0.0:8080 /home/coder/project']
    mem_limit: 512m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    logging: *logging
volumes:
  uploads:
  code_home:
secrets:
  upload_htpasswd:
    file: ./.secrets/upload.htpasswd
  code_password:
    file: ./.secrets/code_password
  tls_cert:
    file: ./.secrets/server.crt
  tls_key:
    file: ./.secrets/server.key

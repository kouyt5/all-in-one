version: '3.8'
services:
  redis:
    image: redis:alpine3.15
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - REDIS_PORT_NUMBER=6379
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/srv/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--dir", "/srv/data"]
    restart: always
volumes:
  redis_data:
    driver: local

name: Frontend tests
on:
  push:
    paths: ['nginx/src/app/**', '.github/workflows/node.js.yml']
  pull_request:
    paths: ['nginx/src/app/**', '.github/workflows/node.js.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nginx/src/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nginx/src/app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

name: Backend tests
on:
  push:
    paths: ['nginx/src/fuploads/**', '.github/workflows/gradle.yml']
  pull_request:
    paths: ['nginx/src/fuploads/**', '.github/workflows/gradle.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nginx/src/fuploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test bootJar --no-daemon
